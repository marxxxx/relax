name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # all branches, for staging/<branch>/

      # main's web/ is published at the root, every other branch's web/ under
      # staging/<branch>/ (see build-site.sh). Local .css/.js references in HTML
      # and relative ES module imports in JS get ?v=<commit> appended so each
      # deploy busts browser caches for them.
      - name: Prepare site
        run: |
          bash .github/scripts/build-site.sh _site
          grep -rhoE '(href|src)="[^"]+\?v=[^"]+"' _site --include='*.html' | sort | uniq -c
          grep -rhoE "'\.\.?/[^']+\?v=[^']+'" _site --include='*.js' | sort | uniq -c

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
