<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lichtung – Prototyp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Karla:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="scene" aria-label="3D-Szene einer Waldhütte auf einer Lichtung"></canvas>

<div class="top">
  <div class="title">
    <h1>Lichtung</h1>
    <p id="mood">Goldene Stunde, klar</p>
  </div>
  <div class="icons">
    <button class="iconbtn walk" id="modeBtn" aria-pressed="false" aria-label="Zwischen Ich-Perspektive und Rundblick wechseln">Hineingehen</button>
    <button class="iconbtn" id="lookBtn" aria-pressed="true" aria-label="Filmlook ein- oder ausschalten">Filmlook</button>
    <button class="iconbtn" id="speedBtn" aria-label="Tempo der Zeit ändern">1 h / 8 s</button>
    <button class="iconbtn" id="soundBtn" aria-pressed="false" aria-label="Klang ein- oder ausschalten">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path id="waves" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13" opacity=".35"/></svg>
      <span id="soundLbl">Klang</span>
    </button>
  </div>
</div>

<div class="joy" id="joy" aria-hidden="true"><div class="joyKnob" id="joyKnob"></div></div>
<div class="hint" id="hint">Ziehen zum Umsehen, Pinch oder Mausrad zum Zoomen</div>

<div class="panel">
  <div class="card">
    <div class="timeRow">
      <button class="play" id="playBtn" aria-label="Zeit anhalten">
        <svg id="playIcon" viewBox="0 0 16 16" fill="currentColor"><rect x="3" y="2" width="3.5" height="12" rx="1"/><rect x="9.5" y="2" width="3.5" height="12" rx="1"/></svg>
      </button>
      <div class="day">
        <input type="range" id="time" min="0" max="24" step="0.01" value="17" aria-label="Tageszeit">
        <div class="track"></div>
        <div class="knob" id="knob"></div>
      </div>
      <div class="clock" id="clock">17:00</div>
    </div>
    <div class="weather" role="group" aria-label="Wetter">
      <button class="chip" data-w="klar" aria-pressed="true"><span>☀️</span>Klar</button>
      <button class="chip" data-w="wolken" aria-pressed="false"><span>⛅</span>Bewölkt</button>
      <button class="chip" data-w="regen" aria-pressed="false"><span>🌧️</span>Regen</button>
      <button class="chip" data-w="gewitter" aria-pressed="false"><span>⛈️</span>Gewitter</button>
      <button class="chip" data-w="schnee" aria-pressed="false"><span>❄️</span>Schnee</button>
      <button class="chip" data-w="nebel" aria-pressed="false"><span>🌫️</span>Nebel</button>
    </div>
  </div>
</div>

<div class="loader" id="loader"><p>Die Lichtung erwacht …</p></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
